name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: publish-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
      - name: Run checks
        run: mise run check

  publish:
    name: Publish ${{ matrix.target.key }}
    needs: check
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.CONFIG).targets }}
    env:
      CONFIG: ${{ vars.CONFIG }}
      TARGET: ${{ matrix.target.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.3
      - name: Render
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: uv run --no-project .github/scripts/render.py
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .render/${{ matrix.target.key }}
          file: .github/oci.Dockerfile
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.target.key }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.target.key }}:main
