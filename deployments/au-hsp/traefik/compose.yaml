services:
  traefik:
    command:
      - --api.dashboard=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delayBeforeChecks=10s
      - --certificatesresolvers.cloudflare.acme.dnschallenge.propagation.requireAllRNS=false
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.cloudflare.acme.email=max@excloo.com
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --entrypoints.traefik.address=:8082
      - --entrypoints.web.address=:80
      - --entrypoints.webinternal.address=:8000
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=autocompress@docker
      - --entrypoints.websecure.http.tls.certResolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=hsp.au.excloo.net
      - --entrypoints.websecure.http.tls.domains[0].sans=*.hsp.au.excloo.net
      - --entrypoints.websecure.http.tls.domains[1].main=hsp.au.excloo.dev
      - --entrypoints.websecure.http.tls.domains[1].sans=*.hsp.au.excloo.dev
      - --providers.docker.defaultRule=Host(`{{ index .Labels "com.docker.compose.project" | trimPrefix "ix-"}}.hsp.au.excloo.dev`)
      - --providers.docker.exposedbydefault=false
      - --providers.docker=true
      - --serverstransport.insecureskipverify=true
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    extra_hosts:
      - host.docker.internal:127.0.0.1
    image: traefik:v3.7.10
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.autocompress.compress: "true"
      traefik.http.middlewares.internal-only.ipallowlist.sourcerange: 10.0.0.0/22, 10.4.0.0/22, 100.64.0.0/10, 127.0.0.1/32, 172.16.0.0/12, ::1/128, 2401:dc20:21ac::/64, 2401:dc20:21ac:3::/64, fd7a:115c:a1e0::/48, fdd0::/48
      traefik.http.middlewares.redirect-to-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: https
      traefik.http.middlewares.traefik-monitoring.basicauth.headerfield: X-Auth-Request-User
      traefik.http.middlewares.traefik-monitoring.basicauth.removeheader: "true"
      traefik.http.middlewares.traefik-monitoring.basicauth.users: ${MONITORING_PASSWORD_HASH}
      traefik.http.routers.traefik-http.entrypoints: web
      traefik.http.routers.traefik-http.middlewares: internal-only@docker,redirect-to-https@docker
      traefik.http.routers.traefik-http.rule: Host(`traefik.hsp.au.excloo.dev`)
      traefik.http.routers.traefik-http.service: traefik
      traefik.http.routers.traefik-monitoring.entrypoints: websecure
      traefik.http.routers.traefik-monitoring.middlewares: internal-only@docker,traefik-monitoring@docker
      traefik.http.routers.traefik-monitoring.rule: Host(`traefik.hsp.au.excloo.dev`) && HeaderRegexp(`Authorization`, `^Basic `)
      traefik.http.routers.traefik-monitoring.service: api@internal
      traefik.http.routers.traefik-monitoring.tls.certresolver: cloudflare
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.middlewares: internal-only@docker,oauth2-forward-auth@docker
      traefik.http.routers.traefik.rule: Host(`traefik.hsp.au.excloo.dev`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.tls.certresolver: cloudflare
      traefik.http.services.traefik.loadbalancer.server.port: "8082"
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
volumes:
  letsencrypt:
